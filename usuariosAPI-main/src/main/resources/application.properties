# ============================================================
# Variables de entorno
# ---------------------------------------------------------
# Cada valor puede definirse como variable de entorno del sistema
# o en un archivo .env en la raiz del proyecto (ver .env.example).
# Una variable de entorno del sistema tiene prioridad sobre el .env.
# ============================================================

# --- Conexion MySQL / MariaDB (phpMyAdmin) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA (Hibernate detecta el dialecto automaticamente)
# 'update' mantiene la columna productos.url_imagen al dia.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- AWS S3 (imagenes de productos) ---
aws.s3.bucket-name=${AWS_S3_BUCKET:apirest-productos-imagenes-proyecto}
aws.s3.region=${AWS_REGION:us-east-2}
# Si access-key y secret-key quedan vacios se usa la cadena estandar de AWS
# (variables de entorno, ~/.aws/credentials o el rol de la instancia EC2).
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.session-token=${AWS_SESSION_TOKEN:}

# --- Limites de subida de archivos ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Impuestos ---
# Porcentaje de IVA que se anade al subtotal de cada factura.
app.iva.porcentaje=${IVA_PORCENTAJE:12}

# --- CORS (frontend Angular en desarrollo) ---
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# --- Carga opcional del archivo .env ---
spring.config.import=optional:file:.env[.properties]
